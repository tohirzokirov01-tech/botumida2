version: '3.8'

services:
  app:
    build: .
    container_name: course_bot_app
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    networks:
      - bot_network

  db:
    image: postgres:16-alpine
    container_name: course_bot_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: course_bot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bot_network

  redis:
    image: redis:7-alpine
    container_name: course_bot_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - bot_network

  nginx:
    image: nginx:alpine
    container_name: course_bot_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - bot_network

networks:
  bot_network:
    driver: bridge

volumes:
  postgres_data:
